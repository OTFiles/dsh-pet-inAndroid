name: build-android

# 在 GitHub Actions 上构建 Android APK（本机环境不编译 Android）：
#   - 构建机装 ffmpeg 做一次性素材预处理（WebM → 旁路 alpha h264，体积反而更小）；
#   - Gradle 编译 Kotlin/Compose → 签名 Release APK；
#   - 产物上传为 Artifact；推送 v* 标签时同时创建 GitHub Release。
# 手机上不包含 ffmpeg 等任何额外组件。

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: '打 Release 的标签（留空只出 Artifact）'
        required: false
        default: ''

jobs:
  # 快速编译检查：不依赖素材，第一时间暴露 Kotlin/构建脚本错误
  compile-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Compile Kotlin
        working-directory: android
        run: ./gradlew :app:compileReleaseKotlin --no-daemon --stacktrace

  build:
    needs: compile-check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install ffmpeg (build-time asset preprocessing only)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
          ffmpeg -decoders 2>/dev/null | grep -c libvpx || true

      - name: Preprocess assets (WebM → side-by-side alpha h264)
        run: bash android/scripts/prepare-assets.sh
        env:
          PET_JOBS: 4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-pet-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release (tag pushes / dispatch with tag)
        if: steps.version.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: dsh-pet Android ${{ steps.version.outputs.tag }}
          body: |
            ## dsh-pet 桌宠 · Android 版 ${{ steps.version.outputs.tag }}

            - 透明悬浮窗桌宠，显示在任意应用之上（悬浮窗权限）
            - 91 段动画完整移植（WebM → 旁路 alpha，手机上零额外组件）
            - MD3 界面，可开关毛玻璃效果（默认关）
            - 设置中可开启"隐藏后台"（android:excludeFromRecents）
            - 多开、AI 对话、自言自语、彩蛋、余额查询、快捷启动
            - 最低 Android 9（API 28）

            安装：下载 APK 侧载安装（需允许"未知来源"），首次启动授予悬浮窗权限。
          files: android/app/build/outputs/apk/release/*.apk
